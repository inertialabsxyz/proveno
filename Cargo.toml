[package]
name = "proveno"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["proveno-compiler", "proveno-orchestrator","proveno-witness","verifier","proveno-noir","proveno-demo"]
resolver = "2"

[features]
default = ["std", "poseidon", "tls"]
std = ["dep:serde_json"]
zkvm = []

# BN254 Poseidon2 commitments, byte-identical to what the Noir circuit
# recomputes. Required by the Noir proving path (`proveno-noir`, `make test-prove`).
#
# Pulls in the noir-lang acir ecosystem and, through bn254_blackbox_solver,
# wasmer + cranelift. cranelift 0.91 pins target-lexicon 0.12, whose build
# script hard-panics on target triples it does not recognise, including the
# custom RISC-V triples zkVM toolchains use. Leave this off for zkVM guest
# builds and use the SHA-256 commitment scheme instead
# (`OracleTape::commitment_hash_sha256`, `compute_public_inputs_sha256`).
poseidon = ["dep:acir", "dep:bn254_blackbox_solver"]

# TLS attestation producer. Commits over Poseidon2 to match the circuit, so it
# implies `poseidon`; also carries the cert-chain verification stack.
tls = [
    "poseidon",
    "dep:p256",
    "dep:p384",
    "dep:x509-cert",
    "dep:webpki-roots",
    "dep:rsa",
]

[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
# Keccak-256 (Ethereum/Solidity flavour, not NIST SHA3) for the output_hash
# commitment the on-chain consumer checks via keccak256(outputPayload).
sha3 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
p256 = { optional = true, version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { optional = true, version = "0.13", default-features = false, features = ["ecdsa"] }
x509-cert = { optional = true, version = "0.2", default-features = false }
webpki-roots = { optional = true, version = "0.26" }
# RSA signature verification for cert chains where intermediate/root CAs use RSA
rsa = { version = "0.9", default-features = false, optional = true }
# Poseidon2 hashing for Noir-circuit-friendly commitments (see `poseidon` feature).
acir = { version = "0.46", optional = true }
bn254_blackbox_solver = { version = "0.46", optional = true }

[dev-dependencies]
serde_json = "1"
rustls = { version = "0.23", features = ["std"] }
