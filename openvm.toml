# OpenVM application config for the proveno guest.
#
# `sha2` enables the SHA-256 accelerator chip. It is the reason the guest
# commits with SHA-256 rather than the Poseidon2 scheme the Noir backend uses:
# in a RISC-V zkVM a Poseidon2 permutation is 488 software 254-bit modmuls
# absorbing 3 bytes, while SHA-256 is one instruction per 64-byte block.
[app_vm_config.rv32i]
[app_vm_config.rv32m]
[app_vm_config.io]
[app_vm_config.sha2]
