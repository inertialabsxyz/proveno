[package]
name = "proveno-demo"
version.workspace = true
# Not yet on the workspace edition; migrating this crate to 2024 is separate work.
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde.workspace = true
serde_json.workspace = true
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
proveno = { path = "..", features = ["serde"] }
proveno-orchestrator = { path = "../proveno-orchestrator" }
dotenvy.workspace = true
tempfile.workspace = true
alloy = { version = "0.7", features = [
    "network",
    "rpc-client",
    "providers",
    "transports",
    "transport-http",
    "sol-types",
    "json-rpc",
    "contract",
] }
reqwest.workspace = true
hex.workspace = true
