[package]
name = "proveno-openvm-host"
version = "0.1.0"
edition = "2021"

[dependencies]
# Host-side driver for the OpenVM backend, mirroring what proveno-noir does for
# the Noir backend. Deliberately built without `poseidon`: this path commits
# with SHA-256, and skipping the feature keeps wasmer/cranelift out of the
# build entirely.
proveno = { path = "../", default-features = false, features = ["std", "zkvm", "serde"] }
# `openvm::serde::to_vec` is the exact encoding `StdIn::write` uses, so the
# bytes produced here are what the guest's `openvm::io::read` expects.
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", features = ["std"] }
serde_json = "1"
hex = "0.4"
