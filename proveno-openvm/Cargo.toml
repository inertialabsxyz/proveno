[package]
name = "proveno-openvm"
version = "0.1.0"
edition = "2021"

[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.2", features = ["std"] }
# `default-features = false` is load-bearing, not tidiness: the default
# `poseidon` feature pulls bn254_blackbox_solver -> wasmer -> cranelift ->
# target-lexicon 0.12, whose build script hard-panics on the custom RISC-V
# target triple this crate compiles for. `zkvm` brings in PublicInputs and the
# SHA-256 commitment helpers, which is the guest-side commitment scheme.
proveno = { path = "../", default-features = false, features = ["zkvm", "serde"] }
